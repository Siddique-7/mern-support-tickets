services:
  backend:
    image: YOUR_DOCKERHUB_USER/mern-support-tickets-backend:latest
    container_name: support-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend.env

  frontend:
    image: YOUR_DOCKERHUB_USER/mern-support-tickets-frontend:latest
    container_name: support-frontend
    ports:
      - "80:80"
    depends_on:
      - backend